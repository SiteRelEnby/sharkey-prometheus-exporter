name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck is preinstalled on the ubuntu runners.
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -S style
